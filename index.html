<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snap Ledger</title>
<meta name="description" content="Expense ledger that reads card statement screenshots on your phone.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1016" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/cards-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/cards-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#EBEDF2; --line:#DDE0E8; --ink:#141925; --ink-2:#454C5E; --muted:#747B8F;
  --accent:#2446D6; --accent-ink:#FFFFFF; --accent-soft:#DFE5FB; --accent-mid:#A9B8F2;
  --good:#1B7A50; --good-soft:#DCF0E5; --warn:#A36A00; --warn-soft:#FCEFC7; --warn-fill:#E5A800; --bad:#BD3526; --bad-soft:#F8DEDA;
  --h1:#FFF3CC; --h2:#FBDE8A; --h3:#F0B93A; --h4:#A86200; --h-ink:#5A3A00; --h4-ink:#FFFFFF; --h1-line:#EBC862;
  --track:#E4E7EE; --scrim:rgba(14,18,28,.42); --shadow:0 1px 2px rgba(20,25,37,.05),0 10px 30px rgba(20,25,37,.10);
  --tabh:66px;
  --sans:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1016; --surface:#161A22; --surface-2:#1D222C; --line:#2A303C; --ink:#E8EBF2; --ink-2:#B5BBCB; --muted:#868EA2;
    --accent:#8198FF; --accent-ink:#0D1016; --accent-soft:#1E2748; --accent-mid:#3A4A8C;
    --good:#52C48E; --good-soft:#14281E; --warn:#F2C14E; --warn-soft:#332810; --warn-fill:#F2C14E; --bad:#F27B6B; --bad-soft:#331B17;
    --h1:#3B2F12; --h2:#5E4511; --h3:#8F650E; --h4:#D9920A; --h-ink:#F8E3AE; --h4-ink:#1B1203; --h1-line:#6E5518;
    --track:#242A35; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1016; --surface:#161A22; --surface-2:#1D222C; --line:#2A303C; --ink:#E8EBF2; --ink-2:#B5BBCB; --muted:#868EA2;
  --accent:#8198FF; --accent-ink:#0D1016; --accent-soft:#1E2748; --accent-mid:#3A4A8C;
  --good:#52C48E; --good-soft:#14281E; --warn:#F2C14E; --warn-soft:#332810; --warn-fill:#F2C14E; --bad:#F27B6B; --bad-soft:#331B17;
  --h1:#3B2F12; --h2:#5E4511; --h3:#8F650E; --h4:#D9920A; --h-ink:#F8E3AE; --h4-ink:#1B1203; --h1-line:#6E5518;
  --track:#242A35; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-bottom:calc(var(--tabh) + 40px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding-block:10px 8px}
.brand{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.month{display:flex;align-items:center;justify-content:center;gap:4px}
.month-lab{font-weight:600;font-size:17px;padding:6px 8px;border-radius:8px;min-width:150px;text-align:center;white-space:nowrap}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.top-title{text-align:center;font-weight:600;font-size:17px}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin-block:4px 12px;font-size:14px}
.banner.plain{background:var(--surface-2)}
.banner b{font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;white-space:nowrap;flex:none;padding-inline:18px;border-radius:12px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.small{height:34px;padding-inline:12px;border-radius:9px;font-size:14px}
.btn.ghost{background:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);background:var(--bad-soft)}
.btn.wide{width:100%}
.link{color:var(--accent);font-weight:600}

/* summary */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:4px 14px}
.fig{background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
.fig .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fig .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig .v.good{color:var(--good)} .fig .v.bad{color:var(--bad)}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chips.sugg{margin:-6px 0 12px}
.chips.sugg .chip{display:block;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:30px}
.in.filled{animation:fill-flash .9s ease-out}
@keyframes fill-flash{from{background:var(--accent-soft);border-color:var(--accent)}}
.chip{flex:none;height:32px;padding-inline:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ledger */
.day{margin-bottom:10px;background:var(--surface);border-radius:14px;overflow:hidden}
.day-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 6px;font-size:13px;color:var(--muted);font-weight:600}
.day-h .num{font-weight:500}
.tx{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 14px;border-top:1px solid var(--line)}
.tx:hover{background:var(--surface-2)}
.tx-cat{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-main{min-width:0;display:flex;flex-direction:column}
.tx-m{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-acc{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;text-align:right;white-space:nowrap}
.tx-amt.inc,.tx-amt.ref{color:var(--good)}
.tx-amt.xfer,.tx-amt.adj{color:var(--muted)} .tx-amt.back{color:var(--good)}
.tx-ow{color:var(--accent);font-weight:600}
.ow-grp{padding:10px 0;border-top:1px solid var(--line)} .ow-grp:first-of-type{border-top:0;padding-top:0}
.ow-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ow-name{font-weight:600;font-size:16px} .ow-amt{font-size:18px}
.ow-list{margin-top:6px}
.set-list{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-top:-6px}
.set-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line);font-size:14px}
.set-row:first-child{border-top:0}
.set-row input{width:20px;height:20px;accent-color:var(--accent)}
.set-m{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ow-status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:-2px 0 12px;font-size:14px}
.ow-row{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:6px 0;font-size:14px;border-top:1px dashed var(--line)}
.ow-row>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-when{color:var(--good);font-weight:600} .tx-when.up{color:var(--accent)}
.tgl{display:flex;gap:10px;align-items:center;font-size:15px;margin:2px 0 12px}
.tgl input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.sum-note{font-size:13px;color:var(--muted);margin:-8px 0 12px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--surface);border-radius:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:16px;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:var(--shadow);z-index:5}
.fab svg{width:24px;height:24px}

/* section */
.sec{background:var(--surface);border-radius:14px;padding:14px;margin-bottom:12px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.sec-h h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{height:30px;padding-inline:12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* bars */
.track{position:relative;height:8px;border-radius:4px;background:var(--track)}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.fill.good{background:var(--good)} .fill.warn{background:var(--warn-fill)} .fill.bad{background:var(--bad)} .fill.idle{background:var(--muted)}
.tick{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px;opacity:.55}
.bar-sub{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}

.trend{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px;border-bottom:1px solid var(--line);padding-top:22px}
.trend{position:relative}
.trend-ov{position:absolute;left:0;right:0;top:22px;bottom:0;pointer-events:none}
.trend-b{position:absolute;left:0;right:0;height:0}
.trend-b::before{content:'';position:absolute;left:0;right:0;top:0;border-top:1.5px dashed var(--ink-2);opacity:.6}
.trend-b span{position:absolute;left:0;bottom:3px;font-size:10px;font-weight:600;line-height:14px;color:var(--ink-2);background:var(--surface);padding:0 4px;border-radius:4px;white-space:nowrap}
.tb.over .tb-bar{background:var(--bad);opacity:.55}
.tb.cur.over .tb-bar{background:var(--bad);opacity:1}
.tb{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.tb-bar{width:60%;max-width:38px;border-radius:4px 4px 0 0;background:var(--accent-mid);min-height:2px}
.tb.cur .tb-bar{background:var(--accent)}
.tb-val{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap;visibility:hidden;margin-bottom:4px}
.tb.cur .tb-val,.tb:hover .tb-val,.tb:focus-visible .tb-val{visibility:visible}
.trend-labs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;text-align:center;font-size:12px;color:var(--muted);padding-top:6px}
.trend-labs .cur{color:var(--ink);font-weight:600}

/* budget */
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding-inline:8px;border-radius:11px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill svg{width:12px;height:12px}
.pill.idle{background:var(--surface-2);color:var(--muted)}
.bar-tag{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.t-warn{color:var(--warn);font-weight:600}
.t-bad{color:var(--bad);font-weight:600}
.bgt-edit{display:grid;grid-template-columns:1fr 130px;gap:8px 12px;align-items:center}
.bgt-edit label{font-weight:500}
.bgt-total-l{padding-top:10px;border-top:1px solid var(--line)}
.bgt-total{padding:10px 10px 0;border-top:1px solid var(--line);text-align:right;font-size:16px}

/* cards */
.card-tile{display:block;width:100%;text-align:left;background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;border:1px solid var(--line)}
.card-tile .stripe{position:absolute;left:0;right:0;top:0;height:4px;background:var(--accent)}
.card-tile.debit .stripe{background:var(--good)} .card-tile.cash .stripe,.card-tile.other .stripe{background:var(--muted)}
.ct-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ct-name{font-weight:600;font-size:16px}
.ct-l4{font-family:var(--mono);color:var(--muted);font-size:13px}
.ct-amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:22px;margin-block:8px 2px}
.ct-meta{font-size:12px;color:var(--muted)}
.ct-k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:10px}
.ct-k+.ct-amt{margin-top:2px}
.ct-ok,.bal-ok{background:var(--accent-soft);color:var(--accent)}
.ct-top .ct-name{flex:1;min-width:0}
.ct-pen{width:36px;height:36px;margin:-8px -10px -8px -2px;align-self:center;color:var(--muted)}
.ct-pen svg{width:18px;height:18px}
.ct-done{color:var(--good)}
.ct-meta svg{width:12px;height:12px;vertical-align:-1px;margin-right:5px}
.ct-tx{display:flex;align-items:center;justify-content:space-between;width:calc(100% + 32px);margin:14px -16px -16px;padding:11px 16px 12px;border-top:1px solid var(--line);font-size:14px;font-weight:500;color:var(--ink-2);text-align:left}
.ct-tx svg{width:18px;height:18px;color:var(--muted)}
.ct-tx:active{background:var(--surface-2)}
.bal-ok{width:100%;margin-top:12px}
.ct-none{font-size:13px;margin:10px 0 0}
.ct-cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ct-cats span{font-size:12px;background:var(--surface-2);border-radius:8px;padding:3px 8px;color:var(--ink-2)}
.ct-cats span b{font-family:var(--mono);font-weight:500}
.ct-bal{display:flex;align-items:baseline;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.ct-bal .k{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ct-bal .v{font-size:17px}
.ct-bal .m{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.bal-sum>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:5px;font-size:15px}
.bal-sum>div>span:first-child{color:var(--ink-2)}
.bal-sum .net{border-top:1px solid var(--line);margin-top:4px;padding-top:10px;font-weight:600;font-size:18px}
.bal-sum .net>span:first-child{color:var(--ink)}
.bal-sum .proj{margin-top:6px;padding-top:10px;border-top:1px dashed var(--line);font-size:16px}
.bal-sum .proj>span:first-child{color:var(--ink-2)}
.proj-note{font-size:12px;line-height:1.45;color:var(--muted);margin:2px 0 0}
.ct-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.ct-acts .btn:only-child{grid-column:1/-1}
@media (max-width:340px){.ct-acts .btn{padding-inline:6px;font-size:13px}}
.bal-diff{font-size:14px;margin:-4px 0 10px;min-height:1.4em}
/* outside-budget yearly view */
.sp-head,.sp-row{display:grid;grid-template-columns:34px minmax(0,1fr) 76px 84px;gap:8px;align-items:center}
.sp-head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding-bottom:4px}
.sp-head span:nth-child(n+3){text-align:right}
.sp-row{width:100%;text-align:left;padding-block:8px;border-top:1px solid var(--line)}
.sp-row .num{text-align:right;font-size:13px}
.sp-row .sp-v{color:var(--ink-2)}
.sp-m{color:var(--ink-2);font-size:13px}
.sp-row.cur .sp-m{color:var(--ink);font-weight:700}
.sp-track{position:relative;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.sp-fill{position:absolute;top:0;bottom:0;left:0;background:var(--accent-mid)}
.sp-add{position:absolute;top:0;bottom:0;background:var(--accent)}
.save-fill{position:absolute;top:0;bottom:0;left:0;border-radius:4px}
.save-fill.hit{background:var(--good)} .save-fill.up{background:var(--accent-mid)} .save-fill.down{background:var(--bad);opacity:.7}
.save-fill.proj{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 3px,transparent 3px 7px)}
.save-tgt{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);opacity:.5;border-radius:1px;z-index:1}
.save-cheer{margin:10px 0 0;font-size:14px;font-weight:600;color:var(--good)}
.save-sp{position:absolute;top:0;bottom:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--muted);border-radius:0 4px 4px 0}
.save-sp.hit{box-shadow:inset 0 0 0 1.5px var(--good)} .save-sp.up{box-shadow:inset 0 0 0 1.5px var(--accent-mid)}
.sv-split{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.sv-split>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:4px;font-size:14px;color:var(--ink-2)}
.sv-split .net{color:var(--ink);font-weight:600;font-size:15px}
.sv-why{font-size:13px;line-height:1.45;color:var(--ink-2);margin:4px 0 0}
.sv-chart{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.sv-ch{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lgd{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2);margin:6px 0 2px}
.lgd span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.lgd i{display:inline-block;width:14px;height:8px;border-radius:2px}
.lgd i.hit{background:var(--good)} .lgd i.up{background:var(--accent-mid)} .lgd i.down{background:var(--bad);opacity:.7}
.lgd i.sp{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--muted)}
.lgd i.tg{width:2px;height:12px;border-radius:1px;background:var(--ink);opacity:.5}
.lgd i.pj{background:var(--muted);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.6) 0 2px,transparent 2px 5px)}
.sv-year{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.sv-split .sv-sp{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:4px;font-size:14px;color:var(--ink-2);width:100%;text-align:left}

/* stats */
.sec-r{font-size:13px;color:var(--muted);white-space:nowrap}
.hero{padding:16px 16px 0;overflow:hidden}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:22px;margin-bottom:2px}
.hero-k{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero-big{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 8px}
.hero-big .num{font-size:36px;font-weight:500;letter-spacing:-.03em;line-height:1.15}
.hero-big small{font-size:15px;color:var(--muted)}
.hero-sub{font-size:14px;line-height:1.45;color:var(--ink-2);margin:4px 0 0}
.hbar{position:relative;margin-top:16px}
.hbar.marked{padding-top:18px}
.hbar-lab{position:absolute;top:0;transform:translateX(-50%);font-size:11px;font-weight:600;line-height:14px;color:var(--muted)}
.track.lg{height:12px;border-radius:6px}
.track.lg .fill{border-radius:6px}
.hero-note{font-size:13px;line-height:1.45;color:var(--ink-2);margin:10px 0 0}
.hero-note.muted{color:var(--muted)}
.hero-day{font-size:13px;color:var(--muted)}
.hero-month{margin:16px -16px 0;padding:14px 16px 0;border-top:1px solid var(--line)}
.cheer{display:flex;gap:12px;align-items:center;margin-top:14px;padding:10px 12px;border-radius:14px;background:var(--good-soft);animation:cheer-in .5s ease-out both}
.cheer-ic{width:30px;height:30px;flex:none;border-radius:50%;background:var(--good);display:grid;place-items:center}
.cheer-ic svg{width:16px;height:16px;fill:#fff;animation:cheer-star .9s .25s ease-out both}
.cheer-tx{display:flex;flex-direction:column;gap:1px;min-width:0;line-height:1.35}
.cheer-tx b{font-size:14px;font-weight:600;color:var(--ink)}
.cheer-tx span{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
@keyframes cheer-in{from{opacity:0;transform:translateY(6px) scale(.97)}}
@keyframes cheer-star{0%{transform:scale(0) rotate(-60deg)} 60%{transform:scale(1.25) rotate(10deg)} 100%{transform:none}}
@media (prefers-reduced-motion: reduce){.cheer,.cheer svg{animation:none}}
.hero-links{margin:14px -16px 0;border-top:1px solid var(--line)}
.hero-link{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:48px;text-align:left;padding:10px 12px 10px 16px;font-size:14px;color:var(--ink)}
.hero-link+.hero-link{border-top:1px solid var(--line)}
.hero-link:hover,.crow:hover{background:var(--surface-2)}
.chev{width:16px;height:16px;flex:none;color:var(--muted)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 16px;column-gap:8px;align-items:center;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.crow>:not(.chev){grid-column:1}
.crow>.chev{grid-column:2;grid-row:1 / span 3}
.sec-h+.crow,.crow-h+.crow{border-top:0}
.sec-h+.crow{padding-top:2px}
.crow-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.crow-name{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow-st{font-size:13px;font-weight:500;white-space:nowrap;color:var(--ink-2)}
.crow-st.good{color:var(--good);font-weight:600} .crow-st.warn{color:var(--warn);font-weight:600} .crow-st.bad{color:var(--bad);font-weight:600}
.st-sub .t-good,.bar-sub .t-good{font-weight:600}
.crow .track{display:block;margin-top:8px}
.crow-amt{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.crow.plain{padding-block:12px}
.crow-h{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:14px 0 2px;border-top:1px solid var(--line)}
.st-k{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 2px}
.st-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.sheet .st-head h2{margin:0}
.st-big .num{font-size:28px}
.sm-num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.st-sub{font-size:14px;line-height:1.45;color:var(--ink-2);margin:4px 0 0}
.st-sec{background:var(--surface);border-radius:14px;padding:14px;margin-top:14px}
.st-sec h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.st-note{font-size:12px;line-height:1.45;color:var(--muted);margin:10px 0 0}
.st-acts{margin-top:16px}
.sv-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sv-pct{font-size:22px;color:var(--ink-2)}
.sv-delta{margin:4px 0 0;font-size:13px}
.dl{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.sv-delta .dl{font-size:13px}
.dl.up{color:var(--good)} .dl.down{color:var(--bad)}
.sv-note{font-size:13px;line-height:1.45;color:var(--ink-2);margin:10px 0 0}
.sv-hist{margin-top:4px}
.sv-row{display:grid;grid-template-columns:36px minmax(0,1fr) 84px;gap:10px;align-items:center;width:100%;text-align:left;padding-block:7px}
.sv-m{font-size:13px;color:var(--ink-2)}
.sv-row.cur .sv-m{color:var(--ink);font-weight:700}
.sv-v{text-align:right;font-size:13px}

/* import */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border:1.5px dashed var(--accent-mid);border-radius:14px;padding:26px 16px;background:var(--surface);cursor:pointer}
.drop.over{background:var(--accent-soft)}
.drop svg{width:34px;height:34px;color:var(--accent)}
.drop b{font-size:16px}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:12px}
.thumb{position:relative;aspect-ratio:9/16;max-width:100%;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.thumb.pdf{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;text-align:center}
.pdf-badge{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 8px}
.pdf-name{font-size:11px;color:var(--ink-2);word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:13px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:15px;line-height:1}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field>span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.in{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding-inline:10px;font-size:16px;min-width:0}
select.in{padding-inline:8px 4px}
textarea.in.ta{height:auto;min-height:110px;padding:10px;resize:vertical;line-height:1.4;font-family:var(--mono);font-size:16px}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row2>*,.field>*{min-width:0}
/* a row that shares its width among whichever fields are showing */
.row2.fit{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.in.amt{height:52px;font-size:22px;font-weight:500}
/* iOS gives date inputs a wide built-in minimum; let them fit their column */
input[type=date].in{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left}
input[type=date].in::-webkit-date-and-time-value{text-align:left;margin:0}
input[type=date].in::-webkit-datetime-edit{padding:0}
.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;margin-block:12px;font-size:14px}
.how{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px;font-size:14px;color:var(--ink-2)}
.how li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.how li span{font-family:var(--mono);color:var(--accent);font-weight:500}
.ib-steps{margin-top:4px}
.ib-steps li>div{display:grid;gap:8px;justify-items:start}
.ib-steps li>div>p{margin:0;line-height:1.45}
.ib-steps li>div b{color:var(--ink)}
.ib-steps .in{width:100%}
#ib-script{margin-top:12px;font-size:12px}
.reading{text-align:center;padding:40px 16px;background:var(--surface);border-radius:14px}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--accent);margin:0 auto 14px;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}

.rv-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.rv-tools select.in{height:36px;font-size:14px;width:auto;flex:1 1 140px}
.rv{display:grid;grid-template-columns:28px 1fr;gap:8px;background:var(--surface);border-radius:14px;padding:12px 12px 10px 10px;margin-bottom:8px;border:1px solid transparent}
.rv.off{opacity:.55}
.rv.invalid{border-color:var(--bad)}
.rv-check{display:flex;justify-content:center;padding-top:12px}
.rv-check input{width:20px;height:20px;accent-color:var(--accent)}
.rv-body{display:grid;gap:8px;min-width:0}
.rv-l1{display:grid;grid-template-columns:1fr 118px;gap:8px}
.rv-amt{position:relative}
.rv-amt .in{text-align:right;font-family:var(--mono);padding-left:28px}
.rv-amt .cur{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;font-family:var(--mono)}
.rv-l2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,0.85fr);gap:8px}
.rv-l2 [data-f=cat]{grid-column:1 / -1}
.rv-l2 .in{height:40px;font-size:15px}
.rv-l3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.rv-l3 label{display:flex;flex-direction:column;gap:3px;min-width:0}
.rv-l3 label>span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.rv-l3 .in{height:40px;font-size:15px}
.in.unsure{border-color:var(--warn);background:var(--warn-soft)}
.rv-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.raw{color:var(--muted);font-size:11px;word-break:break-word}
.tag{display:inline-flex;align-items:center;height:20px;padding-inline:7px;border-radius:10px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--ink-2)}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.good{background:var(--good-soft);color:var(--good)} .tag.acc{background:var(--accent-soft);color:var(--accent)}
.rv-foot{position:sticky;bottom:calc(var(--tabh) + 10px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 14px;box-shadow:var(--shadow);margin-top:12px}
.rv-foot .t{display:flex;flex-direction:column;font-size:13px;line-height:1.3}
.rv-foot .t .num{font-size:15px}
.rv-foot .btn.primary{background:var(--accent);color:var(--accent-ink)}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-bottom:10px}

/* celebration bunny */
.bn-fx,.sw-fx{--bn-fur:#FFF8EF;--bn-line:#2B3040;--bn-pink:#FFB3C4;--bn-nose:#FF7E9A;--bn-belly:#FFEEDD}
.bn-fx{--T:1.9s;
  position:fixed;left:50%;bottom:calc(var(--tabh) + 8px + env(safe-area-inset-bottom,0px));width:240px;height:270px;margin-left:-120px;z-index:30;pointer-events:none}
.bn-halo{position:absolute;left:50%;bottom:-10px;width:250px;height:250px;margin-left:-125px;border-radius:50%;background:radial-gradient(circle at 50% 58%,var(--bg) 0,var(--bg) 38%,transparent 68%);opacity:0;animation:bn-halo var(--T) both}
:is(.bn-fx,.sw-fx) .bunny{display:block;overflow:visible}
:is(.bn-fx,.sw-fx) .fur{fill:var(--bn-fur);stroke:var(--bn-line);stroke-width:2.6}
:is(.bn-fx,.sw-fx) .pw{stroke-width:2.2}
:is(.bn-fx,.sw-fx) .in{fill:var(--bn-pink)}
:is(.bn-fx,.sw-fx) .belly{fill:var(--bn-belly)}
:is(.bn-fx,.sw-fx) .ck{fill:var(--bn-pink);opacity:.6}
:is(.bn-fx,.sw-fx) .open circle{fill:var(--bn-line)} :is(.bn-fx,.sw-fx) .open .hl{fill:#fff}
:is(.bn-fx,.sw-fx) .happy path{fill:none;stroke:var(--bn-line);stroke-width:2.6;stroke-linecap:round}
:is(.bn-fx,.sw-fx) .ns{fill:var(--bn-nose)}
:is(.bn-fx,.sw-fx) .mo{fill:none;stroke:var(--bn-line);stroke-width:2;stroke-linecap:round}
.bn-move{position:absolute;left:50%;bottom:14px;margin-left:-52px;animation:bn-move var(--T) both}
.bn-squash{transform-origin:50% 100%;animation:bn-squash var(--T) both}
.bn-ear{transform-box:fill-box;transform-origin:50% 92%}
.bn-fx .bn-ear.l{animation:bn-ear-l var(--T) both} .bn-fx .bn-ear.r{animation:bn-ear-r var(--T) both}
.bn-eyes{transform-box:fill-box;transform-origin:50% 50%}
.bn-eyes.happy{opacity:0}
.bn-fx .bn-eyes.open{animation:bn-open var(--T) both} .bn-fx .bn-eyes.happy{animation:bn-happy var(--T) both}
.bn-shadow{position:absolute;left:50%;bottom:8px;width:84px;height:14px;margin-left:-42px;border-radius:50%;background:rgba(10,14,24,.28);filter:blur(1.5px);animation:bn-shadow var(--T) both}
.bn-burst{position:absolute;left:50%;bottom:120px;width:0;height:0}
.bn-bit{position:absolute;left:0;top:0;width:8px;height:8px;background:var(--c);border-radius:50%;opacity:0;animation:bn-pop .95s cubic-bezier(.15,.7,.3,1) both}
.bn-bit.bar{width:11px;height:4px;border-radius:2px}
.bn-bit.star{width:11px;height:11px;border-radius:0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.bn-spark{position:absolute;left:var(--x);top:var(--y);width:12px;height:12px;background:#F2C14E;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:0;animation:bn-spark .6s ease-out both}
.bn-badge{position:absolute;left:50%;bottom:222px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;padding:8px 14px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow);opacity:0;animation:bn-badge var(--T) both}
@keyframes bn-move{
  0%{transform:translateY(170px);animation-timing-function:cubic-bezier(.2,.8,.3,1)}
  16%,26%{transform:translateY(0);animation-timing-function:cubic-bezier(.25,.9,.4,1)}
  39%{transform:translateY(-54px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}
  52%,82%{transform:translateY(0);animation-timing-function:cubic-bezier(.5,0,.9,.6)}
  100%{transform:translateY(190px)}}
@keyframes bn-squash{
  0%{transform:scale(.9,1.1)} 16%{transform:scale(1.16,.82)} 21%{transform:scale(.96,1.05)} 26%{transform:scale(1.1,.86)}
  31%{transform:scale(.9,1.12)} 42%{transform:scale(1,1)} 52%{transform:scale(1.18,.8)} 58%{transform:scale(.96,1.05)}
  64%,78%{transform:scale(1,1)} 82%{transform:scale(1.1,.88)} 88%{transform:scale(.92,1.1)} 100%{transform:scale(1,1)}}
@keyframes bn-ear-l{0%,24%{transform:rotate(0)} 34%{transform:rotate(16deg)} 44%{transform:rotate(-12deg)} 54%{transform:rotate(14deg)} 62%{transform:rotate(-5deg)} 68%,72%{transform:rotate(0)} 75%{transform:rotate(-14deg)} 79%,100%{transform:rotate(0)}}
@keyframes bn-ear-r{0%,24%{transform:rotate(0)} 34%{transform:rotate(-16deg)} 44%{transform:rotate(12deg)} 54%{transform:rotate(-14deg)} 62%{transform:rotate(5deg)} 68%,100%{transform:rotate(0)}}
@keyframes bn-open{0%,29%{opacity:1} 31%,60%{opacity:0} 62%,69%{opacity:1;transform:none} 70.5%{opacity:1;transform:scaleY(.1)} 72%,100%{opacity:1;transform:none}}
@keyframes bn-happy{0%,29%{opacity:0} 31%,60%{opacity:1} 62%,100%{opacity:0}}
@keyframes bn-shadow{0%{opacity:0;transform:scale(.5)} 16%,26%{opacity:1;transform:scale(1)} 39%{opacity:.45;transform:scale(.6)} 52%,82%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(.5)}}
@keyframes bn-pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)} 12%{opacity:1} 70%{opacity:1;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1)} 100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y) + 30px)) rotate(calc(var(--r) * 1.8)) scale(.7)}}
@keyframes bn-spark{0%{opacity:0;transform:scale(0) rotate(0)} 45%{opacity:1;transform:scale(1.15) rotate(45deg)} 100%{opacity:0;transform:scale(.4) rotate(90deg)}}
@keyframes bn-halo{0%{opacity:0} 12%,84%{opacity:.94} 100%{opacity:0}}
@keyframes bn-badge{0%,38%{opacity:0;transform:translate(-50%,10px) scale(.6)} 46%{opacity:1;transform:translate(-50%,-4px) scale(1.08)} 52%,84%{opacity:1;transform:translate(-50%,0) scale(1)} 100%{opacity:0;transform:translate(-50%,-18px) scale(.96)}}

/* success screen */
.ok-fx{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 24px 60px;text-align:center;cursor:pointer;animation:ok-in .25s ease-out both}
.ok-fx.out{animation:ok-out .24s ease-in both}
.ok-bg{position:absolute;inset:0;background:var(--bg);opacity:.96;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ok-stage{position:relative;width:240px;height:240px;margin-bottom:16px}
.ok-circle{position:absolute;inset:0;overflow:visible}
.ok-disc{fill:var(--good-soft);transform-box:fill-box;transform-origin:center;animation:ok-disc .5s .45s cubic-bezier(.3,1.5,.5,1) both}
.ok-stroke{fill:none;stroke:var(--good);stroke-width:5;stroke-linecap:round;stroke-dasharray:566;stroke-dashoffset:566;transform:rotate(-90deg);transform-origin:120px 120px;animation:ok-draw .65s .1s cubic-bezier(.65,0,.35,1) both}
.ok-ring{position:absolute;left:30px;top:30px;width:180px;height:180px;border-radius:50%;border:2px solid var(--good);opacity:0;animation:ok-ring 1.1s 1.02s ease-out both}
.ok-ring.r2{animation-delay:1.24s}
/* The window the bunny rises through: the circle, plus everything above its middle so the head can
   pop out over the top of the ring. */
.ok-peek{position:absolute;left:-20px;right:-20px;top:-44px;bottom:0;
  -webkit-mask-image:radial-gradient(circle at 50% 164px,#000 89.5px,transparent 90.5px),linear-gradient(#000,#000);-webkit-mask-size:100% 100%,100% 164px;-webkit-mask-position:0 0,0 0;-webkit-mask-repeat:no-repeat;
  mask-image:radial-gradient(circle at 50% 164px,#000 89.5px,transparent 90.5px),linear-gradient(#000,#000);mask-size:100% 100%,100% 164px;mask-position:0 0,0 0;mask-repeat:no-repeat}
.ok-bunny{position:absolute;left:15px;top:58px;width:250px;transform-origin:50% 100%;animation:ok-rise .72s .55s linear both}
.ok-bob{position:relative;transform-origin:50% 92%;animation:ok-bob 1.6s 1.3s ease-in-out both}
.ok-bob img{display:block;width:100%;height:auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ok-lens{position:absolute;border-radius:50%;overflow:hidden}
.ok-lens.l{left:25%;top:21.1%;width:22%;height:19%}
.ok-lens.r{left:60.4%;top:21.8%;width:21%;height:19.3%}
.ok-lens::after{content:'';position:absolute;top:-30%;bottom:-30%;left:0;width:42%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.85) 50%,rgba(255,255,255,0));transform:translateX(-130%) skewX(-22deg);animation:ok-glint .55s 1.32s ease-in-out both}
.ok-lens.r::after{animation-delay:1.42s}
.ok-gleam{position:absolute;left:77%;top:25.5%;width:26px;height:26px;margin:-13px 0 0 -13px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:0;animation:ok-gleam .65s 1.66s ease-out both}
.ok-bub{position:absolute;bottom:34px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);background:rgba(255,255,255,.2);opacity:0;animation:ok-bub 1.3s ease-out both}
.ok-splash{position:absolute;left:120px;top:40px;width:0;height:0}
.ok-drop{position:absolute;left:0;top:0;border-radius:50%;background:var(--c);opacity:0;animation:ok-drop .75s cubic-bezier(.2,.7,.4,1) both}
.ok-check{position:absolute;right:16px;bottom:18px;width:60px;height:60px;overflow:visible;animation:ok-pop .5s 1.12s cubic-bezier(.3,1.7,.5,1) both}
.ok-check circle{fill:var(--good);stroke:var(--bg);stroke-width:4}
.ok-check path{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:34;stroke-dashoffset:34;animation:ok-tick .32s 1.32s ease-out both}
.ok-title{position:relative;font-size:23px;margin:0 0 6px;animation:ok-up .45s 1.2s ease-out both}
.ok-sub{position:relative;color:var(--ink-2);font-size:15px;margin:0;max-width:320px;animation:ok-up .45s 1.34s ease-out both}
.ok-hint{position:relative;color:var(--muted);font-size:12px;margin:26px 0 0;animation:ok-up .45s 1.75s ease-out both}
@keyframes ok-in{from{opacity:0}}
@keyframes ok-out{to{opacity:0;transform:scale(1.03)}}
@keyframes ok-draw{to{stroke-dashoffset:0}}
@keyframes ok-disc{from{opacity:0;transform:scale(.55)}}
@keyframes ok-ring{0%{opacity:.7;transform:scale(1)} 100%{opacity:0;transform:scale(1.6)}}
@keyframes ok-rise{
  0%{transform:translateY(100%) scale(.94,1.07);animation-timing-function:cubic-bezier(.22,.75,.4,1)}
  58%{transform:translateY(-6%) scale(.97,1.05);animation-timing-function:cubic-bezier(.5,0,.6,1)}
  76%{transform:translateY(1.5%) scale(1.05,.94);animation-timing-function:ease-out}
  90%{transform:translateY(-.6%) scale(.99,1.01)}
  100%{transform:none}}
@keyframes ok-bob{0%,100%{transform:none} 30%{transform:translateY(-4px) rotate(-2.5deg)} 65%{transform:translateY(1px) rotate(2deg)}}
@keyframes ok-glint{from{transform:translateX(-130%) skewX(-22deg)} to{transform:translateX(270%) skewX(-22deg)}}
@keyframes ok-gleam{0%{opacity:0;transform:scale(0) rotate(0)} 40%{opacity:1;transform:scale(1.2) rotate(45deg)} 100%{opacity:0;transform:scale(.3) rotate(90deg)}}
@keyframes ok-drop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)} 12%{opacity:1} 55%{opacity:1;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1)} 100%{opacity:0;transform:translate(calc(-50% + var(--x) * 1.12),calc(-50% + var(--y) + 34px)) scale(.6)}}
@keyframes ok-bub{0%{opacity:0;transform:translateY(0) scale(.6)} 20%{opacity:.9} 100%{opacity:0;transform:translateY(-70px) translateX(6px) scale(1.1)}}
@keyframes ok-pop{from{transform:scale(0) rotate(-30deg)}}
@keyframes ok-tick{to{stroke-dashoffset:0}}
@keyframes ok-up{from{opacity:0;transform:translateY(10px)}}

/* quick sweep */
.sw-fx{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}
.sw-fly{position:absolute;left:50%;top:100%;width:100px;margin-left:-50px;animation:sw-fly .95s cubic-bezier(.42,0,.58,1) both}
.sw-lean{transform:rotate(6deg) scale(.94,1.1);transform-origin:50% 60%}
.sw-lean .bunny{width:100px;height:117px}
.sw-trail{position:absolute;left:50%;top:92px;width:40px;height:220px;margin-left:-20px;border-radius:20px;background:linear-gradient(to bottom,rgba(255,179,196,.55),rgba(155,140,255,.28) 45%,transparent);filter:blur(3px)}
.sw-fx .bn-ear.l{transform:rotate(-13deg)} .sw-fx .bn-ear.r{transform:rotate(13deg)}
.sw-fx .bn-eyes.open{opacity:0} .sw-fx .bn-eyes.happy{opacity:1}
.sw-star{position:absolute;left:50%;width:18px;height:18px;margin-top:-9px;background:var(--c);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);opacity:0;animation:sw-star .7s ease-out both}
.sw-pill{position:absolute;left:50%;bottom:calc(var(--tabh) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;padding:8px 14px;border-radius:999px;white-space:nowrap;box-shadow:var(--shadow);opacity:0;animation:sw-pill 1.5s .15s both}
@keyframes sw-fly{0%{transform:translate(-46px,0) rotate(-4deg)} 100%{transform:translate(40px,calc(-100vh - 320px)) rotate(4deg)}}
@keyframes sw-star{0%{opacity:0;transform:scale(0) rotate(0)} 30%{opacity:1;transform:scale(1.25) rotate(40deg)} 60%{opacity:1;transform:scale(1) rotate(70deg)} 100%{opacity:0;transform:scale(.3) rotate(120deg)}}
@keyframes sw-pill{0%{opacity:0;transform:translate(-50%,10px) scale(.9)} 16%{opacity:1;transform:translate(-50%,-2px) scale(1.04)} 24%,78%{opacity:1;transform:translate(-50%,0) scale(1)} 100%{opacity:0;transform:translate(-50%,-6px)}}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink)}
.tab.scan .disc{width:44px;height:34px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.tab.scan.on .disc{box-shadow:0 0 0 3px var(--accent-soft)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:19px;margin:0 0 14px;text-wrap:balance}
.sheet-actions{display:flex;gap:10px;margin-top:8px}
.sheet-actions .btn{flex:1}
.cat-list{display:grid;gap:6px;margin-bottom:10px}
.cat-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px;align-items:center}
.cat-item .mv{width:34px;height:40px;border-radius:10px;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center}
.cat-item .mv svg{width:18px;height:18px}
.cat-item .mv:disabled{opacity:.3}
.cat-item .in{height:40px}
.sub-h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 0 8px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-top:1px solid var(--line);font-size:14px}

.toast{position:fixed;left:0;right:0;margin-inline:auto;width:max-content;bottom:calc(var(--tabh) + 20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.toast.up{bottom:auto;margin-top:env(safe-area-inset-top,0px)}
.toast-act{margin-left:14px;padding:4px 2px;font:inherit;font-weight:700;color:var(--accent-mid);background:none}
/* Narrow screens (320px wide): keep the month switcher inside the screen. */
@media (max-width:340px){.month-lab{min-width:0;font-size:15px;padding-inline:4px} .month .icon-btn{width:34px}}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.banner.wrap{flex-wrap:wrap}
.banner-acts{display:flex;gap:8px;flex-wrap:wrap}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
label.btn{cursor:pointer}
.grp{margin-bottom:14px}
.grp-h{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;margin:4px 0 8px}
.grp-thumb{width:34px;height:50px;object-fit:cover;object-position:top;border-radius:6px;border:1px solid var(--line);grid-row:span 2}
.grp-info{display:flex;flex-direction:column;min-width:0;font-size:13px;line-height:1.3}
.grp-info b{font-size:14px}
.grp-acc{grid-column:2;height:38px;font-size:15px}
.grp-h:not(:has(.grp-thumb)) .grp-acc{grid-column:1 / -1}
.grp-h:not(:has(.grp-thumb)){grid-template-columns:1fr}
.grp-empty{font-size:13px;background:var(--surface);border-radius:12px;padding:10px 12px;margin:0}
.card-tile.wallet .stripe{background:var(--warn)}
.wl{text-align:center;padding:4px 4px 0}
.wl-icon{width:64px;height:64px;margin:6px auto 10px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.wl-icon svg{width:32px;height:32px}
.wl-icon.app{background:none;width:76px;height:76px;display:block}
.wl-icon.app img{display:block;width:76px;height:76px;max-width:none;border-radius:18px;box-shadow:var(--shadow)}
.wl-step{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 4px}
.wl h2{margin-bottom:10px}
.wl-body{text-align:left;font-size:15px;line-height:1.5;color:var(--ink-2)}
.wl-body p{margin:0 0 10px}
.wl-body ul,.wl-body ol{margin:0 0 10px;padding-left:20px;display:grid;gap:6px}
.wl-body .muted{font-size:13px}
.t-good{color:var(--good)}
.wl-dots{display:flex;justify-content:center;gap:6px;margin:12px 0 4px}
.wl-dots span{width:6px;height:6px;border-radius:3px;background:var(--line)}
.wl-dots span.on{width:18px;background:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-w{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding-bottom:2px}
.cal-d{position:relative;height:46px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:transparent;border:1px solid transparent}
.cal-d.blank{visibility:hidden}
.cal-n{font-size:11px;color:var(--muted);line-height:1}
.cal-v{font-family:var(--mono);font-size:12px;line-height:1.2;min-height:14px;color:var(--ink)}
.cal-d.in{background:var(--surface-2)}
.cal-d.over .cal-v,.cal-d.over .cal-n{color:var(--h-ink);font-weight:600}
.cal-d.h1{background:var(--h1);border-color:var(--h1-line)} .cal-d.h2{background:var(--h2)} .cal-d.h3{background:var(--h3)} .cal-d.h4{background:var(--h4)}
.cal-d.h4 .cal-v,.cal-d.h4 .cal-n{color:var(--h4-ink)}
.cal-d.zero{border-color:var(--line)}
.cal-d.fut{opacity:.35}
.day.flash{box-shadow:0 0 0 2px var(--accent);transition:box-shadow .3s}
.src{margin-top:14px}
.src pre{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.45;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0 0;max-height:360px;overflow:auto;color:var(--ink-2)}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
</style>
</head>

</div>

  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
